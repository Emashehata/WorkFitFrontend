<!-- Sidebar -->
<aside
    class="fixed z-40 flex h-screen w-72 flex-col border-r border-border bg-surface transition-all duration-300 lg:static"
    [class.-translate-x-full]="!opened()">

    <!-- Logo -->
    <div class="border-b border-border px-6 py-6">
        <div class="flex items-center gap-3">
            <div
                class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-primary to-secondary shadow-lg">
                <span class="text-xl font-bold text-white">W</span>
            </div>
            <div>
                <h2 class="text-xl font-bold text-text">WorkFit</h2>
                <p class="text-xs text-text-secondary">Workforce Platform</p>
            </div>
        </div>
    </div>

    <!-- Menu -->
    <nav class="flex-1 overflow-y-auto px-4 py-6">
        @for (section of sections(); track section.title) {
        <!-- Section Header -->
        @if (section.title) {
        <div class="mb-2 mt-4 text-xs font-semibold uppercase tracking-wider text-text-secondary first:mt-0">
            {{ section.title }}
        </div>
        }

        <!-- Items -->
        @for (item of section.items; track item.route) {
        <a [routerLink]="item.route"
            routerLinkActive="bg-gradient-to-r from-primary to-secondary text-white shadow-lg"
            class="group mb-1 flex items-center gap-4 rounded-xl px-4 py-3 font-medium text-text-secondary transition-all duration-300 hover:bg-background hover:text-primary"
            (click)="close.emit()">
            <i [class]="item.icon" class="w-5 text-center text-lg transition-colors"></i>
            <span>{{ item.title }}</span>
            @if (item.badge) {
            <span class="ml-auto rounded-full bg-primary/10 px-2 py-0.5 text-xs font-semibold text-primary">
                {{ item.badge }}
            </span>
            }
        </a>
        }
        }
    </nav>

    <!-- User Profile -->
    <div class="border-t border-border p-4">
        <div class="flex items-center gap-3 rounded-2xl bg-background p-3">
            <div
                class="flex h-11 w-11 items-center justify-center rounded-full bg-gradient-to-r from-primary to-secondary font-bold text-white">
                {{ userInitials() }}
            </div>
            <div>
                <h4 class="text-sm font-semibold text-text">{{ userName() }}</h4>
                <p class="text-xs text-text-secondary">{{ userRole() }}</p>
            </div>
        </div>
    </div>
</aside>
