<header class="bg-surface border-b border-border px-6 py-3 flex items-center justify-between shadow-sm sticky top-0 z-30">
  <!-- Left Side: Toggle button & Breadcrumbs -->
  <div class="flex items-center gap-4">
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="lg:hidden p-2 rounded-xl text-text-secondary hover:bg-background transition-colors">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>
    <div class="hidden sm:flex items-center gap-2 text-sm text-text-secondary">
      <span class="font-bold text-text">WorkFit</span>
      <i class="fa-solid fa-chevron-right text-xs opacity-40"></i>
      <span class="capitalize font-medium text-primary">{{ userRole() }} Portal</span>
    </div>
  </div>

  <!-- Right Side: User Badge & Sign Out Button -->
  <div class="flex items-center gap-4">
    <!-- User Badge -->
    <div class="flex items-center gap-3 bg-background px-3 py-1.5 rounded-xl border border-border">
      <div class="w-8 h-8 rounded-full bg-gradient-to-r from-primary to-secondary text-white font-bold flex items-center justify-center text-xs shadow-sm">
        {{ userInitials() }}
      </div>
      <div class="hidden sm:block text-left">
        <div class="text-xs font-bold text-text leading-tight">{{ userName() }}</div>
        <div class="text-[10px] text-text-secondary font-medium leading-tight">{{ userRole() }}</div>
      </div>
    </div>

    <!-- Sign Out Button -->
    <button
      type="button"
      (click)="logout()"
      class="flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-danger bg-danger/10 hover:bg-danger hover:text-white rounded-xl transition-all shadow-xs cursor-pointer"
      title="Sign Out">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span class="hidden sm:inline">Sign Out</span>
    </button>
  </div>
</header>
