<!-- Floating Agent Trigger Button -->
<div class="agent-fab-wrapper">
  <button
    type="button"
    class="agent-fab-btn"
    [class.active]="isOpen()"
    (click)="toggleChat()"
    title="WorkFit AI Assistant">
    <div class="glow-ring"></div>
    <i class="fa-solid fa-wand-magic-sparkles text-xl" *ngIf="!isOpen()"></i>
    <i class="fa-solid fa-xmark text-xl" *ngIf="isOpen()"></i>
    <span class="fab-badge-pulse" *ngIf="!isOpen()"></span>
  </button>
  <span class="fab-tooltip" *ngIf="!isOpen()">AI Assistant</span>
</div>

<!-- Floating Agent Chat Panel -->
<div class="agent-chat-panel" [class.open]="isOpen()" [class.expanded]="isExpanded()">
  <!-- Panel Header -->
  <div class="agent-panel-header">
    <div class="header-identity">
      <div class="agent-avatar-icon">
        <i class="fa-solid fa-robot"></i>
        <span class="online-indicator"></span>
      </div>
      <div>
        <h4 class="agent-title">WorkFit AI Sidekick</h4>
        <span class="agent-subtitle">Active • Project Assistant</span>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="hdr-btn" (click)="toggleExpand()" [title]="isExpanded() ? 'Collapse View' : 'Expand View'">
        <i class="fa-solid" [class.fa-compress]="isExpanded()" [class.fa-expand]="!isExpanded()"></i>
      </button>
      <button type="button" class="hdr-btn" (click)="clearChat()" title="Clear Chat">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button type="button" class="hdr-btn" (click)="toggleChat()" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Messages Scroll Area -->
  <div class="agent-messages-container" #scrollContainer>
    @for (msg of messages(); track msg.id) {
      <div class="message-row" [class.user-row]="msg.sender === 'user'" [class.agent-row]="msg.sender === 'agent'">
        @if (msg.sender === 'agent') {
          <div class="msg-avatar">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
        }
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">
            <p class="msg-text">{{ msg.text }}</p>
            <div class="msg-footer flex items-center justify-between gap-2 mt-1">
              <span class="msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
              @if (msg.sender === 'agent') {
                <button
                  type="button"
                  class="copy-btn opacity-60 hover:opacity-100 text-[10px] text-gray-500 hover:text-indigo-600 transition-opacity flex items-center gap-1"
                  (click)="copyMessageText(msg)">
                  <i class="fa-solid" [class.fa-check]="copiedMsgId() === msg.id" [class.fa-copy]="copiedMsgId() !== msg.id"></i>
                  <span>{{ copiedMsgId() === msg.id ? 'Copied' : '' }}</span>
                </button>
              }
            </div>
          </div>
        </div>
      </div>
    }

    <!-- Typing Indicator -->
    @if (isSending()) {
      <div class="message-row agent-row">
        <div class="msg-avatar">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble typing-bubble">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Footer Input Bar -->
  <div class="agent-footer-input">
    <input
      type="text"
      class="agent-input-field"
      placeholder="Type your message to AI Assistant..."
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      [disabled]="isSending()" />
    <button
      type="button"
      class="agent-send-btn"
      [disabled]="!userInput().trim() || isSending()"
      (click)="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>
