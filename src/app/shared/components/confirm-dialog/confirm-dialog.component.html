@if (isOpen()) {
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  (click)="onCancel()"
>
  <div
    class="w-full max-w-md rounded-xl bg-surface border border-border shadow-lg p-6"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center gap-3 mb-3">
      @if (headerIcon()) {
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg"
          [class.bg-danger-10]="confirmVariant() === 'danger'"
          [class.text-danger]="confirmVariant() === 'danger'"
          [class.bg-primary-10]="confirmVariant() === 'primary'"
          [class.text-primary]="confirmVariant() === 'primary'"
          [class.bg-secondary-10]="confirmVariant() === 'secondary'"
          [class.text-secondary]="confirmVariant() === 'secondary'">
          <i [class]="headerIcon()"></i>
        </div>
      }
      <h2 class="text-lg font-bold text-text mb-0">{{ title() }}</h2>
    </div>
    <p class="text-sm text-text-secondary mb-4">{{ message() }}</p>

    @if (showInput()) {
      <div class="flex flex-col gap-1.5 mb-5">
        <label class="text-xs text-text-secondary">{{ inputLabel() }}</label>
        <textarea
          rows="3"
          class="p-2 rounded-lg border border-border bg-background text-text text-sm resize-y focus:outline-none focus:ring-2 focus:ring-primary"
          [ngModel]="noteValue()"
          (ngModelChange)="onNoteChange($event)"
        ></textarea>
      </div>
    }

    <div class="flex justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 rounded-lg text-sm font-semibold bg-surface text-text border border-border hover:bg-background cursor-pointer"
        (click)="onCancel()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-lg text-sm font-semibold text-white transition-all flex items-center gap-2 cursor-pointer"
        [class.bg-danger]="confirmVariant() === 'danger'"
        [class.bg-primary]="confirmVariant() === 'primary'"
        [class.bg-secondary]="confirmVariant() === 'secondary'"
        (click)="onConfirm()"
      >
        @if (confirmIcon()) {
          <i [class]="confirmIcon()"></i>
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
}
